<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="'Noto Sans TC', 'Microsoft JhengHei', sans-serif">
  <!-- 背景 -->
  <rect x="0" y="0" width="1600" height="1000" fill="#1e1f24"/>

  <!-- ============ 上方選項列 ============ -->
  <rect x="0" y="0" width="1600" height="56" fill="#2a2c33" stroke="#3a3d46"/>
  <text x="24" y="34" fill="#e8e8ec" font-size="20" font-weight="bold">終末地集成工業模擬器</text>

  <!-- 選項列按鈕群 -->
  <g font-size="15" fill="#c9cad1">
    <rect x="360" y="14" width="70" height="28" rx="4" fill="#3a3d46"/>
    <text x="378" y="33">檔案</text>

    <rect x="440" y="14" width="70" height="28" rx="4" fill="#3a3d46"/>
    <text x="458" y="33">設定</text>

    <rect x="520" y="14" width="80" height="28" rx="4" fill="#3a3d46"/>
    <text x="536" y="33">匯入</text>

    <rect x="610" y="14" width="80" height="28" rx="4" fill="#3a3d46"/>
    <text x="626" y="33">匯出</text>

    <rect x="700" y="14" width="110" height="28" rx="4" fill="#3a3d46"/>
    <text x="716" y="33">基地：武陵 ▾</text>

    <rect x="830" y="14" width="130" height="28" rx="4" fill="#3a3d46"/>
    <text x="846" y="33">視角：佈局 ▾</text>
  </g>

  <!-- 復原 / 取消復原 / 縮放 -->
  <g font-size="14" fill="#9fa2ad">
    <circle cx="1420" cy="28" r="14" fill="#3a3d46"/>
    <text x="1413" y="33">↶</text>
    <circle cx="1460" cy="28" r="14" fill="#3a3d46"/>
    <text x="1453" y="33">↷</text>
    <rect x="1490" y="14" width="90" height="28" rx="4" fill="#3a3d46"/>
    <text x="1502" y="33">100% 縮放</text>
  </g>

  <!-- ============ 中央產線編輯區 ============ -->
  <g>
    <rect x="0" y="56" width="1290" height="784" fill="#202226"/>

    <!-- 格線 -->
    <g stroke="#2c2f36" stroke-width="1">
      <!-- 直線 -->
      <g id="vlines"></g>
    </g>
    <!-- 用 pattern 畫格線比較簡潔 -->
    <defs>
      <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
        <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#2c2f36" stroke-width="1"/>
      </pattern>
    </defs>
    <rect x="0" y="56" width="1290" height="784" fill="url(#grid)"/>

    <text x="24" y="90" fill="#6b6e78" font-size="13">產線編輯區（佈局視角）</text>

    <!-- 基地邊界示意 -->
    <rect x="80" y="120" width="1130" height="660" fill="none" stroke="#4a4e5a" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="90" y="112" fill="#6b6e78" font-size="12">基地邊界（武陵）</text>

    <!-- ===== 設備群：採集 -> 加工 -> 儲存 的一條產線範例 ===== -->

    <!-- 電驅礦機 (採集) 2x2 -->
    <g>
      <rect x="128" y="176" width="96" height="96" rx="6" fill="#3d5a80" stroke="#7aa7d9" stroke-width="2"/>
      <text x="176" y="220" fill="#fff" font-size="13" text-anchor="middle">電驅</text>
      <text x="176" y="238" fill="#fff" font-size="13" text-anchor="middle">礦機</text>
      <!-- 輸出接口 -->
      <circle cx="224" cy="224" r="5" fill="#f2c14e"/>
    </g>

    <!-- 傳送帶 -->
    <line x1="229" y1="224" x2="352" y2="224" stroke="#f2c14e" stroke-width="4"/>
    <polygon points="352,218 366,224 352,230" fill="#f2c14e"/>

    <!-- 精煉爐 (加工) 3x3 -->
    <g>
      <rect x="368" y="160" width="144" height="144" rx="6" fill="#6a4c93" stroke="#b18cd9" stroke-width="2"/>
      <text x="440" y="228" fill="#fff" font-size="14" text-anchor="middle">精煉爐</text>
      <text x="440" y="246" fill="#d9c9ef" font-size="11" text-anchor="middle">3×3</text>
      <circle cx="368" cy="232" r="5" fill="#f2c14e"/>
      <circle cx="512" cy="176" r="5" fill="#f2c14e"/>
    </g>

    <!-- 傳送帶：轉彎 -->
    <polyline points="517,176 560,176 560,224 608,224" fill="none" stroke="#f2c14e" stroke-width="4"/>
    <polygon points="608,218 622,224 608,230" fill="#f2c14e"/>

    <!-- 分流器 -->
    <g>
      <rect x="624" y="200" width="48" height="48" rx="6" fill="#457b5e" stroke="#7fc9a0" stroke-width="2"/>
      <text x="648" y="229" fill="#fff" font-size="10" text-anchor="middle">分流器</text>
    </g>

    <!-- 分流出兩條 -->
    <line x1="672" y1="212" x2="760" y2="150" stroke="#f2c14e" stroke-width="4"/>
    <polygon points="754,150 768,148 762,162" fill="#f2c14e"/>
    <line x1="672" y1="236" x2="760" y2="300" stroke="#f2c14e" stroke-width="4"/>
    <polygon points="754,296 768,300 758,310" fill="#f2c14e"/>

    <!-- 配件機 (加工) -->
    <g>
      <rect x="776" y="96" width="112" height="112" rx="6" fill="#6a4c93" stroke="#b18cd9" stroke-width="2"/>
      <text x="832" y="156" fill="#fff" font-size="13" text-anchor="middle">配件機</text>
    </g>

    <!-- 混合機 (加工) 水管輸入示意 -->
    <g>
      <rect x="776" y="264" width="112" height="96" rx="6" fill="#6a4c93" stroke="#b18cd9" stroke-width="2"/>
      <text x="832" y="316" fill="#fff" font-size="13" text-anchor="middle">混合機</text>
      <!-- 水管 -->
      <circle cx="776" cy="312" r="5" fill="#4fb0e0"/>
    </g>
    <line x1="700" y1="380" x2="776" y2="312" stroke="#4fb0e0" stroke-width="4" stroke-dasharray="2 3"/>
    <text x="660" y="400" fill="#4fb0e0" font-size="11">水管</text>

    <!-- 匯流器 -->
    <g>
      <rect x="920" y="140" width="48" height="120" rx="6" fill="#457b5e" stroke="#7fc9a0" stroke-width="2"/>
      <text x="944" y="204" fill="#fff" font-size="10" text-anchor="middle">匯流器</text>
    </g>
    <line x1="888" y1="152" x2="920" y2="164" stroke="#f2c14e" stroke-width="4"/>
    <line x1="888" y1="312" x2="920" y2="236" stroke="#f2c14e" stroke-width="4"/>

    <!-- 傳送帶到儲存 -->
    <line x1="968" y1="200" x2="1060" y2="200" stroke="#f2c14e" stroke-width="4"/>
    <polygon points="1060,194 1074,200 1060,206" fill="#f2c14e"/>

    <!-- 協議儲存箱 (儲存) -->
    <g>
      <rect x="1080" y="160" width="88" height="88" rx="6" fill="#8a5a2b" stroke="#d99b56" stroke-width="2"/>
      <text x="1124" y="196" fill="#fff" font-size="12" text-anchor="middle">協議</text>
      <text x="1124" y="214" fill="#fff" font-size="12" text-anchor="middle">儲存箱</text>
    </g>

    <!-- 供電樁 + 覆蓋範圍 (電力) -->
    <g>
      <rect x="220" y="430" width="500" height="260" fill="#e8b93a" opacity="0.06" stroke="#e8b93a" stroke-width="1.5" stroke-dasharray="4 3"/>
      <rect x="440" y="530" width="64" height="64" rx="6" fill="#a8862a" stroke="#e8b93a" stroke-width="2"/>
      <text x="472" y="558" fill="#fff" font-size="11" text-anchor="middle">供電</text>
      <text x="472" y="574" fill="#fff" font-size="11" text-anchor="middle">樁</text>
      <text x="472" y="420" fill="#e8b93a" font-size="11" text-anchor="middle">供電覆蓋範圍</text>
    </g>

    <!-- 種植機 x3 (種植) -->
    <g>
      <rect x="260" y="470" width="72" height="72" rx="6" fill="#3f7a3a" stroke="#7fcf6d" stroke-width="2"/>
      <text x="296" y="510" fill="#fff" font-size="11" text-anchor="middle">種植機</text>

      <rect x="260" y="560" width="72" height="72" rx="6" fill="#3f7a3a" stroke="#7fcf6d" stroke-width="2"/>
      <text x="296" y="600" fill="#fff" font-size="11" text-anchor="middle">種植機</text>

      <rect x="260" y="650" width="72" height="72" rx="6" fill="#3f7a3a" stroke="#7fcf6d" stroke-width="2"/>
      <text x="296" y="690" fill="#fff" font-size="11" text-anchor="middle">種植機</text>
    </g>

    <!-- 物流橋跨越示意 -->
    <g>
      <line x1="332" y1="506" x2="600" y2="506" stroke="#f2c14e" stroke-width="4"/>
      <line x1="440" y1="440" x2="440" y2="560" stroke="#4fb0e0" stroke-width="4" stroke-dasharray="2 3"/>
      <rect x="424" y="490" width="32" height="32" rx="4" fill="#5a5f6b" stroke="#a9adbb" stroke-width="1.5"/>
      <text x="440" y="512" fill="#fff" font-size="9" text-anchor="middle">橋</text>
    </g>

    <!-- 錯誤 / 警示高亮設備示意 -->
    <g>
      <rect x="620" y="600" width="80" height="80" rx="6" fill="#6a4c93" stroke="#ff5555" stroke-width="3"/>
      <text x="660" y="636" fill="#fff" font-size="12" text-anchor="middle">配件機</text>
      <text x="660" y="654" fill="#ffb3b3" font-size="10" text-anchor="middle">Error</text>
      <!-- 重疊的紅色高亮 -->
      <rect x="660" y="640" width="80" height="80" rx="6" fill="#6a4c93" opacity="0.6" stroke="#ff5555" stroke-width="3"/>
    </g>
    <text x="620" y="700" fill="#ff8080" font-size="11">↑ 擺放衝突（重疊）僅高亮，不阻擋放置</text>

    <!-- 框選示意 -->
    <rect x="760" y="560" width="220" height="180" fill="#4a90e2" opacity="0.12" stroke="#4a90e2" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="770" y="580" fill="#7fb2ee" font-size="11">框選範圍</text>

    <!-- 視角切換控項（左下角）-->
    <g>
      <rect x="24" y="760" width="300" height="36" rx="6" fill="#2a2c33" stroke="#4a4e5a"/>
      <text x="40" y="783" fill="#e8e8ec" font-size="13">佈局視角</text>
      <text x="140" y="783" fill="#7f828d" font-size="13">流程視角</text>
      <text x="240" y="783" fill="#7f828d" font-size="13">並列視角</text>
      <text x="24" y="812" fill="#6b6e78" font-size="11">（Tab 鍵輪替切換）</text>
    </g>
  </g>

  <!-- ============ 右側側欄：產線總覽面板（整體統計，恆常顯示） ============ -->
  <g>
    <rect x="1290" y="56" width="310" height="784" fill="#26282f" stroke="#3a3d46"/>
    <text x="1310" y="88" fill="#e8e8ec" font-size="16" font-weight="bold">產線總覽</text>

    <!-- 統計面板 -->
    <g font-size="13" fill="#c9cad1">
      <text x="1310" y="122" fill="#e8e8ec" font-weight="bold">整體統計</text>

      <text x="1310" y="146">總耗電量 / 供電量</text>
      <rect x="1310" y="156" width="270" height="10" rx="5" fill="#3a3d46"/>
      <rect x="1310" y="156" width="180" height="10" rx="5" fill="#e8b93a"/>
      <text x="1310" y="182" font-size="11" fill="#9fa2ad">120 kW / 180 kW</text>

      <text x="1310" y="212">產能估算</text>
      <text x="1320" y="232" font-size="12">紫晶纖維　　生產 24/min　消耗 0　淨 +24</text>
      <text x="1320" y="250" font-size="12">紫晶礦　　　生產 0　消耗 48/min　淨 -48</text>

      <text x="1310" y="282">調度券兌換效率</text>
      <text x="1320" y="302" font-size="12">≈ 3.2 券 / min（自訂兌換率）</text>

      <rect x="1300" y="322" width="290" height="1" fill="#3a3d46"/>

      <text x="1310" y="346" fill="#ff8080" font-weight="bold">警示列表</text>
      <rect x="1300" y="358" width="290" height="34" fill="#3a2a2a" rx="4"/>
      <text x="1312" y="379" font-size="12" fill="#ffb3b3">[Error] 配件機 x2 位置重疊</text>

      <rect x="1300" y="398" width="290" height="34" fill="#3a3424" rx="4"/>
      <text x="1312" y="419" font-size="12" fill="#f2d98a">[Warning] 供電範圍總耗電超載</text>
    </g>
  </g>

  <!-- ============ 左側面板：物件資訊面板，點選設備時由左邊滑出 ============ -->
  <g>
    <!-- 滑出方向指示 -->
    <g opacity="0.9">
      <rect x="0" y="120" width="280" height="600" fill="#26282f" stroke="#3a3d46"/>
      <polygon points="280,410 292,420 280,430" fill="#3a3d46"/>
      <text x="12" y="146" fill="#e8e8ec" font-size="15" font-weight="bold">物件資訊面板（點選後滑出）</text>
      <text x="12" y="164" fill="#6b6e78" font-size="10">← 從畫布左緣滑入 / 點空白處收回</text>

      <!-- Tab -->
      <g font-size="12">
        <rect x="12" y="180" width="80" height="26" fill="#3a3d46"/>
        <text x="28" y="197" fill="#e8e8ec">配方表</text>
        <rect x="92" y="180" width="86" height="26" fill="#2e3038"/>
        <text x="106" y="197" fill="#9fa2ad">設備形狀</text>
        <rect x="178" y="180" width="90" height="26" fill="#2e3038"/>
        <text x="192" y="197" fill="#9fa2ad">耗電資訊</text>
      </g>

      <!-- 選中設備資訊（物件資訊面板內容之一：設備） -->
      <g font-size="12" fill="#c9cad1">
        <text x="12" y="230" font-size="13" fill="#e8e8ec">已選取：精煉爐</text>
        <text x="12" y="250">尺寸：3 × 3</text>
        <text x="12" y="268">耗電量：10 kW</text>
        <text x="12" y="286">目前配方：紫晶纖維（15s）</text>

        <rect x="12" y="302" width="256" height="1" fill="#3a3d46"/>

        <text x="12" y="326" font-size="13" fill="#e8e8ec">可用配方一覽</text>
        <rect x="12" y="338" width="256" height="46" fill="#2e3038" rx="4"/>
        <text x="24" y="356">紫晶纖維：紫晶礦×4/min → 紫晶纖維×2/min</text>
        <text x="24" y="372">週期 15s</text>

        <rect x="12" y="390" width="256" height="46" fill="#2e3038" rx="4"/>
        <text x="24" y="408">穩定碳：碳礦×6/min → 穩定碳×3/min</text>
        <text x="24" y="424">週期 20s</text>
      </g>
    </g>
  </g>

  <!-- ============ 下方工具列 ============ -->
  <g>
    <rect x="0" y="840" width="1600" height="160" fill="#26282f" stroke="#3a3d46"/>

    <!-- 分類 Tab -->
    <g font-size="13">
      <rect x="24" y="852" width="72" height="26" fill="#4a4e5a" rx="4"/>
      <text x="40" y="870" fill="#fff">採集</text>

      <rect x="104" y="852" width="72" height="26" fill="#33353d" rx="4"/>
      <text x="120" y="870" fill="#c9cad1">加工</text>

      <rect x="184" y="852" width="72" height="26" fill="#33353d" rx="4"/>
      <text x="200" y="870" fill="#c9cad1">種植</text>

      <rect x="264" y="852" width="72" height="26" fill="#33353d" rx="4"/>
      <text x="280" y="870" fill="#c9cad1">電力</text>

      <rect x="344" y="852" width="72" height="26" fill="#33353d" rx="4"/>
      <text x="360" y="870" fill="#c9cad1">物流</text>

      <rect x="424" y="852" width="72" height="26" fill="#33353d" rx="4"/>
      <text x="440" y="870" fill="#c9cad1">儲存</text>

      <rect x="504" y="852" width="72" height="26" fill="#33353d" rx="4"/>
      <text x="520" y="870" fill="#c9cad1">武器</text>

      <!-- 搜尋框 -->
      <rect x="1380" y="850" width="200" height="30" rx="6" fill="#33353d" stroke="#4a4e5a"/>
      <text x="1394" y="870" fill="#7f828d">搜尋設備...</text>
    </g>

    <!-- 設備圖示列（採集分類展開範例） -->
    <g font-size="11" fill="#c9cad1">
      <!-- item template -->
      <g>
        <rect x="24" y="892" width="88" height="88" rx="6" fill="#33353d" stroke="#4a4e5a"/>
        <rect x="40" y="906" width="56" height="40" rx="4" fill="#3d5a80"/>
        <text x="68" y="964" text-anchor="middle">電驅礦機</text>
      </g>
      <g>
        <rect x="124" y="892" width="88" height="88" rx="6" fill="#33353d" stroke="#4a4e5a"/>
        <rect x="140" y="906" width="56" height="40" rx="4" fill="#3d5a80"/>
        <text x="168" y="964" text-anchor="middle">採種機</text>
      </g>
      <g>
        <rect x="224" y="892" width="88" height="88" rx="6" fill="#33353d" stroke="#4a4e5a"/>
        <rect x="240" y="906" width="56" height="40" rx="4" fill="#6a4c93"/>
        <text x="268" y="964" text-anchor="middle">精煉爐</text>
      </g>
      <g>
        <rect x="324" y="892" width="88" height="88" rx="6" fill="#33353d" stroke="#4a4e5a"/>
        <rect x="340" y="906" width="56" height="40" rx="4" fill="#6a4c93"/>
        <text x="368" y="964" text-anchor="middle">配件機</text>
      </g>
      <g>
        <rect x="424" y="892" width="88" height="88" rx="6" fill="#33353d" stroke="#4a4e5a"/>
        <rect x="440" y="906" width="56" height="40" rx="4" fill="#6a4c93"/>
        <text x="468" y="964" text-anchor="middle">混合機</text>
      </g>
      <g>
        <rect x="524" y="892" width="88" height="88" rx="6" fill="#33353d" stroke="#4a4e5a"/>
        <rect x="540" y="906" width="56" height="40" rx="4" fill="#3f7a3a"/>
        <text x="568" y="964" text-anchor="middle">種植機</text>
      </g>
      <g>
        <rect x="624" y="892" width="88" height="88" rx="6" fill="#33353d" stroke="#4a4e5a"/>
        <rect x="640" y="906" width="56" height="40" rx="4" fill="#a8862a"/>
        <text x="668" y="964" text-anchor="middle">供電樁</text>
      </g>
      <g>
        <rect x="724" y="892" width="88" height="88" rx="6" fill="#33353d" stroke="#4a4e5a"/>
        <rect x="740" y="906" width="56" height="40" rx="4" fill="#a8862a"/>
        <text x="768" y="964" text-anchor="middle">中繼器</text>
      </g>
      <g>
        <rect x="824" y="892" width="88" height="88" rx="6" fill="#33353d" stroke="#4a4e5a"/>
        <rect x="840" y="906" width="56" height="40" rx="4" fill="#457b5e"/>
        <text x="868" y="964" text-anchor="middle">分流器</text>
      </g>
      <g>
        <rect x="924" y="892" width="88" height="88" rx="6" fill="#33353d" stroke="#4a4e5a"/>
        <rect x="940" y="906" width="56" height="40" rx="4" fill="#457b5e"/>
        <text x="968" y="964" text-anchor="middle">匯流器</text>
      </g>
      <g>
        <rect x="1024" y="892" width="88" height="88" rx="6" fill="#33353d" stroke="#4a4e5a"/>
        <rect x="1040" y="906" width="56" height="40" rx="4" fill="#8a5a2b"/>
        <text x="1068" y="964" text-anchor="middle">協議核心</text>
      </g>
      <g>
        <rect x="1124" y="892" width="88" height="88" rx="6" fill="#33353d" stroke="#4a4e5a"/>
        <rect x="1140" y="906" width="56" height="40" rx="4" fill="#8a5a2b"/>
        <text x="1168" y="964" text-anchor="middle">儲存箱</text>
      </g>
      <g opacity="0.5">
        <rect x="1224" y="892" width="60" height="88" rx="6" fill="#2e3038" stroke="#3a3d46" stroke-dasharray="3 3"/>
        <text x="1254" y="940" text-anchor="middle" font-size="20" fill="#6b6e78">…</text>
      </g>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="'Noto Sans TC', 'Microsoft JhengHei', sans-serif">
  <!-- 背景 -->
  <rect x="0" y="0" width="1600" height="1000" fill="#1e1f24"/>

  <!-- ============ 上方選項列（與佈局視角相同） ============ -->
  <rect x="0" y="0" width="1600" height="56" fill="#2a2c33" stroke="#3a3d46"/>
  <text x="24" y="34" fill="#e8e8ec" font-size="20" font-weight="bold">終末地集成工業模擬器</text>

  <g font-size="15" fill="#c9cad1">
    <rect x="360" y="14" width="70" height="28" rx="4" fill="#3a3d46"/>
    <text x="378" y="33">檔案</text>

    <rect x="440" y="14" width="70" height="28" rx="4" fill="#3a3d46"/>
    <text x="458" y="33">設定</text>

    <rect x="520" y="14" width="80" height="28" rx="4" fill="#3a3d46"/>
    <text x="536" y="33">匯入</text>

    <rect x="610" y="14" width="80" height="28" rx="4" fill="#3a3d46"/>
    <text x="626" y="33">匯出</text>

    <rect x="700" y="14" width="110" height="28" rx="4" fill="#3a3d46"/>
    <text x="716" y="33">基地：武陵 ▾</text>

    <!-- 唯一差異：視角下拉目前選中「流程」 -->
    <rect x="830" y="14" width="130" height="28" rx="4" fill="#3a3d46"/>
    <text x="846" y="33">視角：流程 ▾</text>
  </g>

  <!-- 復原 / 取消復原 / 縮放 -->
  <g font-size="14" fill="#9fa2ad">
    <circle cx="1420" cy="28" r="14" fill="#3a3d46"/>
    <text x="1413" y="33">↶</text>
    <circle cx="1460" cy="28" r="14" fill="#3a3d46"/>
    <text x="1453" y="33">↷</text>
    <rect x="1490" y="14" width="90" height="28" rx="4" fill="#3a3d46"/>
    <text x="1502" y="33">100% 縮放</text>
  </g>

  <!-- ============ 中央產線編輯區（差異區域：Flow Chart） ============ -->
  <g>
    <rect x="0" y="56" width="1290" height="784" fill="#202226"/>
    <defs>
      <pattern id="dotgrid" width="28" height="28" patternUnits="userSpaceOnUse">
        <circle cx="1" cy="1" r="1" fill="#2c2f36"/>
      </pattern>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8d99"/>
      </marker>
    </defs>
    <rect x="0" y="56" width="1290" height="784" fill="url(#dotgrid)"/>

    <text x="24" y="90" fill="#6b6e78" font-size="13">產線編輯區（流程視角 — Flow Chart）</text>

    <!-- 右上角：新增流程配方 / 待部署提示 -->
    <g>
      <rect x="980" y="76" width="150" height="32" rx="6" fill="#3a3d46" stroke="#5a5f6b"/>
      <text x="1000" y="97" fill="#e8e8ec" font-size="13">＋ 新增流程配方</text>

      <rect x="1140" y="76" width="150" height="32" rx="6" fill="#4a3d1f" stroke="#e8b93a" stroke-dasharray="4 3"/>
      <text x="1156" y="97" fill="#f2d98a" font-size="12">部署至佈局視角 ▸</text>
    </g>

    <!-- ===== Flow Chart 節點：原料 -> 設備 -> 產物，自左向右 ===== -->

    <!-- 原料節點：紫晶礦 -->
    <g>
      <rect x="60" y="150" width="130" height="56" rx="10" fill="#3a3d46" stroke="#8a8d99" stroke-width="2"/>
      <text x="125" y="173" fill="#fff" font-size="12" text-anchor="middle">紫晶礦（原料）</text>
      <text x="125" y="191" fill="#c9cad1" font-size="11" text-anchor="middle">供給 48/min</text>
    </g>

    <!-- 邊：紫晶礦 -> 精煉爐 -->
    <line x1="190" y1="178" x2="290" y2="178" stroke="#8a8d99" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="200" y="170" fill="#9fa2ad" font-size="10">紫晶礦 48/min</text>

    <!-- 設備節點：精煉爐（效率高=綠） -->
    <g>
      <rect x="292" y="134" width="150" height="88" rx="8" fill="#2f5b3f" stroke="#5fcf7f" stroke-width="2.5"/>
      <text x="367" y="162" fill="#fff" font-size="13" text-anchor="middle" font-weight="bold">精煉爐</text>
      <text x="367" y="180" fill="#d6f5dd" font-size="11" text-anchor="middle">配方：紫晶纖維</text>
      <text x="367" y="198" fill="#d6f5dd" font-size="11" text-anchor="middle">效率 100%</text>
      <text x="367" y="214" fill="#a9e7b6" font-size="10" text-anchor="middle">週期 15s</text>
    </g>

    <!-- 邊：精煉爐 -> 紫晶纖維 -->
    <line x1="442" y1="178" x2="540" y2="178" stroke="#8a8d99" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="450" y="170" fill="#9fa2ad" font-size="10">紫晶纖維 24/min</text>

    <!-- 產物節點：紫晶纖維（中間產物） -->
    <g>
      <ellipse cx="612" cy="178" rx="72" ry="42" fill="#33353d" stroke="#c9cad1" stroke-width="2"/>
      <text x="612" y="172" fill="#fff" font-size="12" text-anchor="middle">紫晶纖維</text>
      <text x="612" y="190" fill="#c9cad1" font-size="10" text-anchor="middle">24/min</text>
    </g>

    <!-- 分岔：往配件機、往混合機 -->
    <line x1="684" y1="166" x2="800" y2="100" stroke="#8a8d99" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="684" y1="190" x2="800" y2="270" stroke="#8a8d99" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="700" y="118" fill="#9fa2ad" font-size="10">12/min</text>
    <text x="700" y="260" fill="#9fa2ad" font-size="10">12/min</text>

    <!-- 設備節點：配件機（效率中=黃） -->
    <g>
      <rect x="802" y="56" width="150" height="88" rx="8" fill="#5c531f" stroke="#e8d24a" stroke-width="2.5"/>
      <text x="877" y="84" fill="#fff" font-size="13" text-anchor="middle" font-weight="bold">配件機</text>
      <text x="877" y="102" fill="#f5edc0" font-size="11" text-anchor="middle">配方：精密零件</text>
      <text x="877" y="120" fill="#f5edc0" font-size="11" text-anchor="middle">效率 72%</text>
      <text x="877" y="136" fill="#e9dd9a" font-size="10" text-anchor="middle">輸入不足</text>
    </g>

    <!-- 設備節點：混合機（效率低=橘），另有水管輸入 -->
    <g>
      <rect x="802" y="226" width="150" height="88" rx="8" fill="#6b3f1f" stroke="#e8873a" stroke-width="2.5"/>
      <text x="877" y="254" fill="#fff" font-size="13" text-anchor="middle" font-weight="bold">混合機</text>
      <text x="877" y="272" fill="#fbdcc0" font-size="11" text-anchor="middle">配方：複合塗料</text>
      <text x="877" y="290" fill="#fbdcc0" font-size="11" text-anchor="middle">效率 45%</text>
      <text x="877" y="306" fill="#f0c79a" font-size="10" text-anchor="middle">水管流量不足</text>
    </g>

    <!-- 水資源原料節點 -->
    <g>
      <rect x="700" y="350" width="120" height="52" rx="10" fill="#1f4a5c" stroke="#4fb0e0" stroke-width="2"/>
      <text x="760" y="371" fill="#fff" font-size="12" text-anchor="middle">純淨水（原料）</text>
      <text x="760" y="388" fill="#bfe6f7" font-size="10" text-anchor="middle">供給 8/min</text>
    </g>
    <line x1="770" y1="350" x2="820" y2="314" stroke="#4fb0e0" stroke-width="2" stroke-dasharray="2 3" marker-end="url(#arrow)"/>

    <!-- 產物節點：精密零件（最終產物） -->
    <g>
      <ellipse cx="1050" cy="100" rx="80" ry="42" fill="#33353d" stroke="#5fcf7f" stroke-width="2.5"/>
      <text x="1050" y="92" fill="#fff" font-size="12" text-anchor="middle">精密零件</text>
      <text x="1050" y="110" fill="#c9cad1" font-size="10" text-anchor="middle">8.6/min（最終）</text>
    </g>
    <line x1="952" y1="100" x2="970" y2="100" stroke="#8a8d99" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="1050" y="160" fill="#f2d98a" font-size="11" text-anchor="middle">≈ 1.4 調度券 / min</text>

    <!-- 產物節點：複合塗料（最終產物） -->
    <g>
      <ellipse cx="1050" cy="270" rx="80" ry="42" fill="#33353d" stroke="#8a8d99" stroke-width="2.5"/>
      <text x="1050" y="262" fill="#fff" font-size="12" text-anchor="middle">複合塗料</text>
      <text x="1050" y="280" fill="#c9cad1" font-size="10" text-anchor="middle">3.6/min（最終）</text>
    </g>
    <line x1="952" y1="270" x2="970" y2="270" stroke="#8a8d99" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="1050" y="330" fill="#f2d98a" font-size="11" text-anchor="middle">≈ 0.6 調度券 / min</text>

    <!-- ===== 第二條範例：中間產物「從倉庫直取」示意 ===== -->
    <text x="60" y="440" fill="#6b6e78" font-size="12">中間產物節點右鍵可切換「使用產線生產／從倉庫直取」：</text>

    <!-- 倉庫節點 -->
    <g>
      <ellipse cx="150" cy="500" rx="80" ry="42" fill="#2e3038" stroke="#9fa2ad" stroke-width="2" stroke-dasharray="5 4"/>
      <text x="150" y="492" fill="#e8e8ec" font-size="12" text-anchor="middle">穩定碳（倉庫）</text>
      <text x="150" y="510" fill="#9fa2ad" font-size="10" text-anchor="middle">直接取用</text>
    </g>
    <line x1="230" y1="500" x2="330" y2="500" stroke="#8a8d99" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="240" y="492" fill="#9fa2ad" font-size="10">6/min</text>

    <!-- 設備節點（消耗倉庫直取品項） -->
    <g>
      <rect x="332" y="456" width="150" height="88" rx="8" fill="#2f5b3f" stroke="#5fcf7f" stroke-width="2.5"/>
      <text x="407" y="484" fill="#fff" font-size="13" text-anchor="middle" font-weight="bold">武器機器</text>
      <text x="407" y="502" fill="#d6f5dd" font-size="11" text-anchor="middle">配方：制式彈藥</text>
      <text x="407" y="520" fill="#d6f5dd" font-size="11" text-anchor="middle">效率 100%</text>
      <text x="407" y="536" fill="#a9e7b6" font-size="10" text-anchor="middle">週期 8s</text>
    </g>

    <line x1="482" y1="500" x2="580" y2="500" stroke="#8a8d99" stroke-width="2" marker-end="url(#arrow)"/>
    <g>
      <ellipse cx="652" cy="500" rx="72" ry="42" fill="#33353d" stroke="#5fcf7f" stroke-width="2"/>
      <text x="652" y="494" fill="#fff" font-size="12" text-anchor="middle">制式彈藥</text>
      <text x="652" y="512" fill="#c9cad1" font-size="10" text-anchor="middle">6/min（最終）</text>
    </g>

    <!-- 待部署節點示意（虛線、半透明） -->
    <g opacity="0.6">
      <rect x="800" y="456" width="150" height="88" rx="8" fill="#3a3d46" stroke="#9fa2ad" stroke-width="2" stroke-dasharray="6 4"/>
      <text x="875" y="490" fill="#e8e8ec" font-size="12" text-anchor="middle">配件機（待部署）</text>
      <text x="875" y="508" fill="#c9cad1" font-size="10" text-anchor="middle">配方：合金外殼</text>
      <text x="875" y="526" fill="#c9cad1" font-size="10" text-anchor="middle">尚未部署至佈局</text>
    </g>

    <!-- 節點類型 / 效率圖例 -->
    <g font-size="11" fill="#9fa2ad">
      <rect x="24" y="600" width="1240" height="130" rx="8" fill="#26282f" stroke="#3a3d46"/>
      <text x="40" y="624" fill="#e8e8ec" font-size="12" font-weight="bold">圖例</text>

      <rect x="40" y="638" width="26" height="20" rx="6" fill="#3a3d46" stroke="#8a8d99"/>
      <text x="74" y="652">原料節點</text>

      <ellipse cx="180" cy="648" rx="20" ry="12" fill="#33353d" stroke="#c9cad1"/>
      <text x="212" y="652">產物節點</text>

      <ellipse cx="300" cy="648" rx="20" ry="12" fill="#2e3038" stroke="#9fa2ad" stroke-dasharray="4 3"/>
      <text x="332" y="652">倉庫節點（直取）</text>

      <rect x="460" y="638" width="26" height="20" rx="4" fill="#3a3d46" stroke="#9fa2ad" stroke-dasharray="4 3"/>
      <text x="494" y="652">待部署節點</text>

      <text x="40" y="684" fill="#e8e8ec" font-size="12" font-weight="bold">設備節點效率顏色</text>
      <rect x="40" y="696" width="20" height="16" rx="3" fill="#2f5b3f" stroke="#5fcf7f"/>
      <text x="68" y="708">綠：高效率</text>
      <rect x="150" y="696" width="20" height="16" rx="3" fill="#5c531f" stroke="#e8d24a"/>
      <text x="178" y="708">黃：中等</text>
      <rect x="260" y="696" width="20" height="16" rx="3" fill="#6b3f1f" stroke="#e8873a"/>
      <text x="288" y="708">橘：偏低</text>
      <rect x="360" y="696" width="20" height="16" rx="3" fill="#3a3d46" stroke="#8a8d99"/>
      <text x="388" y="708">灰：停滯 / Error</text>
    </g>

    <!-- 視角切換控項（左下角，位置與樣式與佈局視角一致，此時流程視角高亮）-->
    <g>
      <rect x="24" y="760" width="300" height="36" rx="6" fill="#2a2c33" stroke="#4a4e5a"/>
      <text x="40" y="783" fill="#7f828d" font-size="13">佈局視角</text>
      <text x="140" y="783" fill="#e8e8ec" font-size="13">流程視角</text>
      <text x="240" y="783" fill="#7f828d" font-size="13">並列視角</text>
      <text x="24" y="812" fill="#6b6e78" font-size="11">（Tab 鍵輪替切換）</text>
    </g>
  </g>

  <!-- ============ 右側側欄：產線總覽面板（與佈局視角相同結構，數值反映流程視角） ============ -->
  <g>
    <rect x="1290" y="56" width="310" height="784" fill="#26282f" stroke="#3a3d46"/>
    <text x="1310" y="88" fill="#e8e8ec" font-size="16" font-weight="bold">產線總覽</text>

    <!-- 統計面板 -->
    <g font-size="13" fill="#c9cad1">
      <text x="1310" y="122" fill="#e8e8ec" font-weight="bold">整體統計</text>

      <text x="1310" y="146">總耗電量 / 供電量</text>
      <rect x="1310" y="156" width="270" height="10" rx="5" fill="#3a3d46"/>
      <rect x="1310" y="156" width="180" height="10" rx="5" fill="#e8b93a"/>
      <text x="1310" y="182" font-size="11" fill="#9fa2ad">120 kW / 180 kW</text>

      <text x="1310" y="212">產能估算</text>
      <text x="1320" y="232" font-size="12">精密零件　　生產 8.6/min　淨 +8.6</text>
      <text x="1320" y="250" font-size="12">複合塗料　　生產 3.6/min　淨 +3.6</text>

      <text x="1310" y="282">調度券兌換效率</text>
      <text x="1320" y="302" font-size="12">≈ 2.0 券 / min（自訂兌換率）</text>

      <rect x="1300" y="322" width="290" height="1" fill="#3a3d46"/>

      <text x="1310" y="346" fill="#ff8080" font-weight="bold">警示列表</text>
      <rect x="1300" y="358" width="290" height="34" fill="#3a3424" rx="4"/>
      <text x="1312" y="379" font-size="12" fill="#f2d98a">[Warning] 配件機輸入不足（72%）</text>

      <rect x="1300" y="398" width="290" height="34" fill="#3a3424" rx="4"/>
      <text x="1312" y="419" font-size="12" fill="#f2d98a">[Warning] 混合機水管流量不足（45%）</text>
    </g>
  </g>

  <!-- ============ 左側面板：物件資訊面板，點選節點時由左邊滑出（與佈局視角相同容器，內容為節點資訊） ============ -->
  <g>
    <g opacity="0.9">
      <rect x="0" y="120" width="280" height="600" fill="#26282f" stroke="#3a3d46"/>
      <polygon points="280,410 292,420 280,430" fill="#3a3d46"/>
      <text x="12" y="146" fill="#e8e8ec" font-size="15" font-weight="bold">物件資訊面板（點選後滑出）</text>
      <text x="12" y="164" fill="#6b6e78" font-size="10">← 點選任一節點顯示對應資訊</text>

      <!-- Tab -->
      <g font-size="12">
        <rect x="12" y="180" width="80" height="26" fill="#3a3d46"/>
        <text x="28" y="197" fill="#e8e8ec">配方表</text>
        <rect x="92" y="180" width="86" height="26" fill="#2e3038"/>
        <text x="106" y="197" fill="#9fa2ad">設備形狀</text>
        <rect x="178" y="180" width="90" height="26" fill="#2e3038"/>
        <text x="192" y="197" fill="#9fa2ad">耗電資訊</text>
      </g>

      <!-- 選中節點資訊（物件資訊面板內容之一：流程節點） -->
      <g font-size="12" fill="#c9cad1">
        <text x="12" y="230" font-size="13" fill="#e8e8ec">已選取：配件機（設備節點）</text>
        <text x="12" y="250">目前配方：精密零件</text>
        <text x="12" y="268">效率：72%（輸入不足）</text>
        <text x="12" y="286">對應佈局設備：uid #a3f9</text>

        <rect x="12" y="302" width="256" height="1" fill="#3a3d46"/>

        <text x="12" y="326" font-size="13" fill="#e8e8ec">輸入 / 輸出</text>
        <rect x="12" y="338" width="256" height="46" fill="#2e3038" rx="4"/>
        <text x="24" y="356">輸入：紫晶纖維 12/min（需求 16.7/min）</text>
        <text x="24" y="372">輸出：精密零件 8.6/min</text>

        <rect x="12" y="390" width="256" height="46" fill="#2e3038" rx="4"/>
        <text x="24" y="408">右鍵此節點（若為產物節點）可切換</text>
        <text x="24" y="424">「產線生產／倉庫直取」</text>
      </g>
    </g>
  </g>

  <!-- ============ 下方工具列（與佈局視角相同） ============ -->
  <g>
    <rect x="0" y="840" width="1600" height="160" fill="#26282f" stroke="#3a3d46"/>

    <!-- 分類 Tab -->
    <g font-size="13">
      <rect x="24" y="852" width="72" height="26" fill="#4a4e5a" rx="4"/>
      <text x="40" y="870" fill="#fff">採集</text>

      <rect x="104" y="852" width="72" height="26" fill="#33353d" rx="4"/>
      <text x="120" y="870" fill="#c9cad1">加工</text>

      <rect x="184" y="852" width="72" height="26" fill="#33353d" rx="4"/>
      <text x="200" y="870" fill="#c9cad1">種植</text>

      <rect x="264" y="852" width="72" height="26" fill="#33353d" rx="4"/>
      <text x="280" y="870" fill="#c9cad1">電力</text>

      <rect x="344" y="852" width="72" height="26" fill="#33353d" rx="4"/>
      <text x="360" y="870" fill="#c9cad1">物流</text>

      <rect x="424" y="852" width="72" height="26" fill="#33353d" rx="4"/>
      <text x="440" y="870" fill="#c9cad1">儲存</text>

      <rect x="504" y="852" width="72" height="26" fill="#33353d" rx="4"/>
      <text x="520" y="870" fill="#c9cad1">武器</text>

      <!-- 搜尋框 -->
      <rect x="1380" y="850" width="200" height="30" rx="6" fill="#33353d" stroke="#4a4e5a"/>
      <text x="1394" y="870" fill="#7f828d">搜尋設備...</text>
    </g>

    <!-- 設備圖示列（採集分類展開範例） -->
    <g font-size="11" fill="#c9cad1">
      <g>
        <rect x="24" y="892" width="88" height="88" rx="6" fill="#33353d" stroke="#4a4e5a"/>
        <rect x="40" y="906" width="56" height="40" rx="4" fill="#3d5a80"/>
        <text x="68" y="964" text-anchor="middle">電驅礦機</text>

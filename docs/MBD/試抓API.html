<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>高雄旅遊網本地執行版</title>
  <style>
    
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f8f9fa; color: #212529; padding: 48px 0; margin: 0; }
    .container { max-width: 1140px; margin: 0 auto; padding: 0 15px; }
    h2 { color: #0d6efd; font-weight: 700; margin-bottom: 24px; }
    .row { display: flex; flex-wrap: wrap; margin: -12px; }
    .col { flex: 0 0 calc(33.333% - 24px); width: calc(33.333% - 24px); margin: 12px; box-sizing: border-box; }
    @media (max-width: 768px) { .col { flex: 0 0 calc(50% - 24px); width: calc(50% - 24px); } }
    .card { background: #fff; border-radius: 8px; box-shadow: 0 0.125rem 0.25rem rgba(0,0,0,0.075); overflow: hidden; display: flex; flex-direction: column; height: 100%; border: 1px solid #dee2e6; cursor: pointer; }
    .img-cover { height: 160px; overflow: hidden; }
    .card img { width: 100%; height: 100%; object-fit: cover; transition: transform .6s; }
    .card:hover img { transform: scale(1.1); }
    .card-body { padding: 16px; flex-grow: 1; }
    .card-title { font-size: 1.25rem; font-weight: bold; margin: 0 0 8px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-text { font-size: 0.875rem; color: #6c757d; margin: 0; }
    .badge { display: inline-block; padding: 4px 8px; font-size: 0.75rem; background: #6c757d; color: #fff; border-radius: 4px; margin-right: 4px; font-style: normal; }
  </style>
</head>
<body>

  <div class="container">
    <h2>高雄旅遊景點（本地保證成功版）</h2>

    <div class="row" id="attractions-list">
      <!-- 網頁內容將會由下方的原生 JavaScript 自動塞入，不依賴 Vue 框架 -->
    </div>
  </div>

  <script>
    
    const localData = [
      {
        Id: "1",
        Name: "蓮池潭風景區",
        Zone: "左營區",
        Add: "高雄市左營區蓮潭路",
        Picture1: "https://unsplash.com"
      },
      {
        Id: "2",
        Name: "駁二藝術特區",
        Zone: "鹽埕區",
        Add: "高雄市鹽埕區大勇路1號",
        Picture1: "https://unsplash.com"
      },
      {
        Id: "3",
        Name: "高雄愛河",
        Zone: "前金區",
        Add: "高雄市前金區河東路",
        Picture1: "https://unsplash.com"
      }
    ];

    // 使用最純粹、絕對不會失效的原生 JavaScript (Vanilla JS) 來渲染畫面
    const listContainer = document.getElementById('attractions-list');
    let htmlContent = '';

    localData.forEach(spot => {
      htmlContent += `
        <div class="col">
          <div class="card">
            <div class="img-cover">
              <img src="${spot.Picture1}" alt="${spot.Name}">
            </div>
            <div class="card-body">
              <h5 class="card-title">${spot.Name}</h5>
              <p class="card-text">
                <i class="badge">${spot.Zone}</i>${spot.Add}
              </p>
            </div>
          </div>
        </div>
      `;
    });

    // 強制寫入網頁結構
    listContainer.innerHTML = htmlContent;
  </script>
</body>
</html>
